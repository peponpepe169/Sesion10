# Bloque que define un servidor virtual (un sitio web)
server {
    # Escucha en el puerto 80 dentro del contenedor (desde fuera es el 8080)
    listen 80;
    # El guion bajo acepta cualquier nombre de host
    server_name _;
    # Carpeta donde están los ficheros web (volumen compartido wp_data)
    root /var/www/html;
    # Fichero que se sirve por defecto al entrar en una carpeta
    index index.php;
    # Tamaño máximo de subida: permite subir imágenes y plugins pesados
    client_max_body_size 64M;

    # Reglas para todas las peticiones que no sean .php
    location / {
        # Busca el fichero, luego la carpeta; si no existe, lo manda a index.php (enlaces permanentes de WordPress)
        try_files $uri $uri/ /index.php?$args;
    }

    # Reglas para las peticiones a ficheros .php
    location ~ \.php$ {
        # Carga los parámetros FastCGI estándar de nginx
        include fastcgi_params;
        # Envía el PHP a PHP-FPM, que está en el servicio wordpress, puerto 9000
        fastcgi_pass wordpress:9000;
        # Indica a PHP la ruta completa del script que debe ejecutar
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
